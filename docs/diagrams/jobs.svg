<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 470" width="1260" height="470" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Zylo7 Sentinel async batch job lifecycle</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font-size: 15px; font-weight: 800; fill: #0f172a; }
      .sub { font-size: 12px; fill: #475569; }
      .mono { font-size: 11.5px; fill: #334155; font-family: 'JetBrains Mono', Menlo, Consolas, monospace; }
      .edge { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .pill { font-size: 12px; font-weight: 700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1260" height="470" rx="18" fill="#ffffff"/>
  <text x="30" y="46" font-size="22" font-weight="800" fill="#0f172a">Async batch job · up to 5,000 tickets</text>
  <text x="30" y="70" class="sub">The client polls GET /batch/jobs/{id} every 2–5 s (Retry-After) while the worker processes the job in the background</text>

  <!-- step cards -->
  <g filter="url(#shadow)">
    <rect x="30" y="100" width="275" height="190" rx="14" fill="#eef2ff" stroke="#a5b4fc"/>
    <rect x="345" y="100" width="275" height="190" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
    <rect x="660" y="100" width="275" height="190" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
    <rect x="975" y="100" width="255" height="190" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
  </g>

  <!-- 1 submit -->
  <circle cx="58" cy="132" r="14" fill="#4f46e5"/><text x="58" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">1</text>
  <text x="82" y="137" class="title">Submit</text>
  <text x="50" y="170" class="mono">POST /batch/jobs</text>
  <text x="50" y="196" class="sub">every ticket validated first:</text>
  <text x="50" y="214" class="sub">any invalid → 422, no job created</text>
  <text x="50" y="244" class="mono">202 · job_id</text>
  <text x="50" y="264" class="mono">Location · Retry-After</text>

  <!-- 2 queue -->
  <circle cx="373" cy="132" r="14" fill="#d97706"/><text x="373" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">2</text>
  <text x="397" y="137" class="title">Queue</text>
  <text x="365" y="170" class="mono">SQLite job store</text>
  <text x="365" y="196" class="sub">1 running + 3 queued,</text>
  <text x="365" y="214" class="sub">otherwise 429 + Retry-After</text>
  <text x="365" y="244" class="sub">same Idempotency-Key</text>
  <text x="365" y="262" class="sub">→ same job returned</text>

  <!-- 3 process -->
  <circle cx="688" cy="132" r="14" fill="#7c3aed"/><text x="688" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">3</text>
  <text x="712" y="137" class="title">Process</text>
  <text x="680" y="170" class="mono">background worker</text>
  <text x="680" y="196" class="sub">chunks of 16 tickets, same model</text>
  <text x="680" y="214" class="sub">as /predict</text>
  <text x="680" y="244" class="sub">processed count only rises;</text>
  <text x="680" y="262" class="sub">/health and /predict stay fast</text>

  <!-- 4 fetch -->
  <circle cx="1003" cy="132" r="14" fill="#059669"/><text x="1003" y="137" text-anchor="middle" fill="#fff" font-size="13" font-weight="800">4</text>
  <text x="1027" y="137" class="title">Fetch results</text>
  <text x="995" y="170" class="mono">GET …/{id}/results</text>
  <text x="995" y="196" class="sub">original request order</text>
  <text x="995" y="214" class="sub">paged with offset · limit</text>
  <text x="995" y="244" class="sub">409 before it succeeds</text>
  <text x="995" y="262" class="sub">410 after 6 hours</text>

  <path class="edge" d="M305,195 H343"/>
  <path class="edge" d="M620,195 H658"/>
  <path class="edge" d="M935,195 H973"/>

  <!-- status flow -->
  <text x="30" y="336" font-size="11" font-weight="700" letter-spacing="1.2" fill="#64748b">JOB STATUS</text>
  <g>
    <rect x="30" y="352" width="104" height="34" rx="17" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="82" y="374" text-anchor="middle" class="pill" fill="#b45309">queued</text>
    <path class="edge" d="M134,369 H168"/>
    <rect x="170" y="352" width="104" height="34" rx="17" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="222" y="374" text-anchor="middle" class="pill" fill="#6d28d9">running</text>
    <path class="edge" d="M274,369 H308"/>
    <rect x="310" y="352" width="114" height="34" rx="17" fill="#d1fae5" stroke="#6ee7b7"/>
    <text x="367" y="374" text-anchor="middle" class="pill" fill="#047857">succeeded</text>
  </g>
  <g>
    <rect x="470" y="352" width="350" height="34" rx="17" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="645" y="374" text-anchor="middle" class="pill" fill="#b91c1c">restart mid-job → failed · "interrupted"</text>
    <rect x="840" y="352" width="390" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="1035" y="374" text-anchor="middle" class="pill" fill="#334155">DELETE → cancelled / discarded · 204, then 404</text>
  </g>

  <!-- legend -->
  <g font-size="11.5" fill="#334155">
    <rect x="30" y="430" width="12" height="12" rx="3" fill="#4f46e5"/><text x="48" y="440">Request handling</text>
    <rect x="175" y="430" width="12" height="12" rx="3" fill="#d97706"/><text x="193" y="440">Storage (survives restarts)</text>
    <rect x="365" y="430" width="12" height="12" rx="3" fill="#7c3aed"/><text x="383" y="440">Model inference</text>
    <rect x="500" y="430" width="12" height="12" rx="3" fill="#059669"/><text x="518" y="440">Results</text>
  </g>
</svg>
