[project]
name = "triage-sentinel"
version = "0.1.0"
description = "RideEat Triage Sentinel: multilingual support-ticket classification and routing (TensorForge 2.0 Phase 2)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies only: this is what ships in the Docker image.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "joblib>=1.4",
    "onnxruntime>=1.19",
    "tokenizers>=0.19",
]

[dependency-groups]
# Training, analysis and test tooling: never installed in the runtime image.
dev = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "pytest>=8.3",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "schemathesis>=3.36",
]
# Transformer training / embedding experiments (local or Kaggle); never in the runtime image.
train = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentence-transformers>=3.0",
    "onnx>=1.16",
    "onnxruntime>=1.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
